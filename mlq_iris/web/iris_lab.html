<title>Laboratório Iris MLP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: bancada de laboratório — trilha de 8 etapas no topo, palco animado à esquerda,
   caderno de notas (narração + inspetor numérico) à direita, transporte fixo embaixo. */
:root{
  --bg:#f3f3f8; --panel:#ffffff; --ink:#1d1b2e; --muted:#5e5b74; --line:#dcdbe8; --soft:#ebeaf3;
  --accent:#5a3fc0; --accent-ink:#ffffff; --neg:#c2562b;
  --c0:#0072b2; --c1:#d48f00; --c2:#009e73;
  --ok:#1f8a4c; --bad:#c23b3b;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14131d; --panel:#1d1c29; --ink:#ecebf6; --muted:#a3a0bb; --line:#33314a; --soft:#26243a;
  --accent:#a593ff; --accent-ink:#14131d; --neg:#f08a5d;
  --c0:#4fb0ea; --c1:#f0b43c; --c2:#2bc59a; --ok:#4cc27e; --bad:#f07070; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14131d; --panel:#1d1c29; --ink:#ecebf6; --muted:#a3a0bb; --line:#33314a; --soft:#26243a;
  --accent:#a593ff; --accent-ink:#14131d; --neg:#f08a5d;
  --c0:#4fb0ea; --c1:#f0b43c; --c2:#2bc59a; --ok:#4cc27e; --bad:#f07070; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:18px 110px}
@media (max-width:700px){.wrap{padding-block-end:170px}}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.5rem,3.2vw,2.1rem);font-weight:700}
.sub{color:var(--muted);margin:.25rem 0 0;max-width:70ch}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
.chip-sp{display:inline-flex;gap:6px;align-items:center;font-size:.8rem;color:var(--muted)}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block}
.sw.c0{background:var(--c0)}.sw.c1{background:var(--c1)}.sw.c2{background:var(--c2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px}

/* trilha de etapas */
nav.track{margin:18px 0 14px;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
nav.track button{flex:1 0 108px}
nav.track button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:8px;
  border:1px solid var(--line);background:var(--panel);min-width:96px;transition:border-color .2s,background .2s}
nav.track button .n{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
nav.track button .t{font-weight:600;font-size:.86rem;line-height:1.2}
nav.track button[aria-current="step"]{border-color:var(--accent);background:color-mix(in oklab,var(--accent) 10%,var(--panel))}
nav.track button[aria-current="step"] .n{color:var(--accent)}
nav.track button.done .n::after{content:" ✓";color:var(--ok)}
nav.track button:focus-visible,.btn:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* bancada */
.bench{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:14px}
@media (max-width:900px){.bench{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.stage-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.stage-head h2{font-size:1.25rem}
.stage-head .tag{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
#viz{width:100%;display:block}
svg text{fill:var(--ink);font-family:var(--f-body)}
svg .muted{fill:var(--muted)}
svg .ax{stroke:var(--line)}
svg .grid{stroke:var(--soft)}
.c0f{fill:var(--c0)}.c1f{fill:var(--c1)}.c2f{fill:var(--c2)}
.c0s{stroke:var(--c0)}.c1s{stroke:var(--c1)}.c2s{stroke:var(--c2)}
.notes{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.card h3{font-size:.95rem;margin-bottom:8px}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:s}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:24px 1fr;gap:8px;padding:6px 8px;border-radius:8px;color:var(--muted);transition:background .25s,color .25s}
ol.steps li::before{content:counter(s);font-family:var(--f-mono);font-size:.75rem;width:22px;height:22px;border-radius:50%;
  display:grid;place-items:center;border:1px solid var(--line);margin-top:1px}
ol.steps li.on{background:color-mix(in oklab,var(--accent) 12%,var(--panel));color:var(--ink)}
ol.steps li.on::before{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
ol.steps li.past{color:var(--ink)}
ol.steps li.past::before{content:"✓";color:var(--ok);border-color:var(--ok)}
ol.steps b{font-weight:600}
.eq{font-family:var(--f-mono);font-size:.82rem;color:var(--accent);display:block;margin-top:2px}
#insp{font-size:.88rem}
#insp table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
#insp th,#insp td{padding:4px 6px;border-bottom:1px solid var(--soft);text-align:right;white-space:nowrap}
#insp th:first-child,#insp td:first-child{text-align:left}
#insp th{font-weight:600;color:var(--muted);font-size:.78rem}
.tscroll{overflow-x:auto}
.bar{height:8px;border-radius:4px;background:var(--accent);transition:width .6s ease}
.barwrap{background:var(--soft);border-radius:4px;height:8px;min-width:60px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.hl{background:color-mix(in oklab,var(--neg) 22%,transparent);border-radius:3px}
.good{color:var(--ok)}.badc{color:var(--bad)}
.note{font-size:.8rem;color:var(--muted);margin:.5rem 0 0}
.ctrls{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:8px}
.ctrls label{display:flex;flex-direction:column;font-size:.75rem;color:var(--muted);gap:2px}
select,.btn{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:5px 9px}
.btn{cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.canvases{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
@media (max-width:600px){.canvases{grid-template-columns:minmax(0,1fr)}}
.canvases canvas{width:100%;display:block;border-radius:8px;background:var(--bg)}
.cap{font-size:.75rem;color:var(--muted);margin:2px 0 0}
.patience{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.patience div{height:100%;background:var(--neg);width:0}
.row-raw{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin:.3rem 0}
.row-raw span{font-family:var(--f-mono);font-size:.78rem;border:1px solid var(--line);border-radius:5px;padding:3px 4px;text-align:center;overflow:hidden;text-overflow:ellipsis;transition:background .3s}
.arrow{color:var(--muted);text-align:center;font-size:.8rem}

/* transporte */
.transport{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
  background:color-mix(in oklab,var(--panel) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:5}
.transport .in{max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.transport .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.prog{flex:1 1 160px;height:4px;background:var(--soft);border-radius:2px;overflow:hidden;min-width:80px}
.prog div{height:100%;background:var(--accent);width:0;transition:width .3s}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:5px 9px;font-size:.8rem;font-family:var(--f-mono)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:focus-visible{outline:2px solid var(--accent)}
@media (prefers-reduced-motion:reduce){.bar,.prog div{transition:none}}
</style>

function netLayout(dims){ const xs=dims.map((_,l)=>110+l*(430/(dims.length-1)));
  return dims.map((n,l)=>{ const gap=Math.min(44,300/Math.max(1,n-1)); const h=gap*(n-1); return Array.from({length:n},(_,i)=>[xs[l],205-h/2+i*gap]); }); }
function drawNet(svg,net){ const dims=net.dims, P=netLayout(dims); const E=[], N=[];
  const eg=el("g",{},svg), ng=el("g",{},svg), lg=el("g",{},svg);
  for(let l=0;l<dims.length-1;l++){ const Wl=net.W[l]; let mx=0; Wl.forEach(r=>r.forEach(w=>mx=Math.max(mx,Math.abs(w)))); E.push(Wl.map((r,i)=>r.map((w,j)=>el("line",{x1:P[l][i][0],y1:P[l][i][1],x2:P[l+1][j][0],y2:P[l+1][j][1],
      stroke:w>=0?"var(--accent)":"var(--neg)","stroke-width":0.4+2.2*Math.abs(w)/mx,"stroke-opacity":0.28},eg)))); }
  const rad=dims.map(n=>Math.max(5,Math.min(13,170/n)));

  net.W.forEach((W,l)=>W.forEach((r,i)=>r.forEach((_,j)=>chk(W,i,j,g.gW[l][i][j]))));
  net.b.forEach((b,l)=>b.forEach((_,j)=>chk([b],0,j,g.gb[l][j]))); return mx; }

    t(gx+bw/2,fy+fh+14,lab,{"text-anchor":"middle",class:"muted","font-size":8.5}); return {e,gx,r:el("rect",{x:gx,width:bw,y:fy+fh,height:0,rx:3,fill:"var(--c0)"},svg),eb:el("line",{x1:gx+bw/2,x2:gx+bw/2,stroke:"var(--ink)",opacity:0},svg)}; });

    for(let j=0;j<3;j++){ const r=el("rect",{x:mx+j*s,y:my+i*s,width:s-3,height:s-3,rx:6,fill:"var(--soft)"},svg); const tt=t(mx+j*s+s/2-1,my+i*s+s/2+5,"",{"text-anchor":"middle","font-size":15,"font-weight":600}); mc.push({i,j,r,tt}); } }
  insp(`<h3>Resultados oficiais</h3><dl class="kv"><dt>k-fold (k = 5)</dt><dd>${pct(PY.kfold.acc_media,2)} ± ${pct(PY.kfold.acc_dp,2)}</dd><dt>F1 macro k-fold</dt><dd>${pct(PY.kfold.f1_media,2)} ± ${pct(PY.kfold.f1_dp,2)}</dd>

  say(0); await tween(c,1100,p=>fb.forEach(({v,r},i)=>{ const q=Math.max(0,Math.min(1,p*1.6-i*0.15)); const y=lerp(fy+fh,yB(v,fy,fh,lo),ease(q)); r.setAttribute("y",y); r.setAttribute("height",fy+fh-y); }),x=>x);

 }});
